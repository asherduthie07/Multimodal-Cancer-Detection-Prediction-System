services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oncofusion
      POSTGRES_USER: oncofusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncofusion"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://oncofusion:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/oncofusion
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_DIR: /artifacts
      WEB_ORIGIN: http://localhost:4200
    volumes: ["artifacts:/artifacts"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "services.worker.run"]
    environment:
      DATABASE_URL: postgresql+psycopg://oncofusion:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/oncofusion
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_DIR: /artifacts
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["4200:4200"]
    depends_on: [api]
volumes:
  pgdata:
  artifacts:
